# ============================================================================
# AEF-BNG Databricks Asset Bundle — Template
# ============================================================================
#
# Copy this file to `databricks.yml` and fill in your values.
#
# Prerequisites:
#   1. Databricks CLI installed and authenticated (`databricks auth login`)
#   2. Wheel built: `make build` (creates dist/wheel/aef_bng-*.whl)
#   3. Init script at deps/init-scripts/aef-bng.sh (included in this repo)
#
# Deployment:
#   databricks bundle validate -t dev
#   databricks bundle deploy -t dev
#   databricks bundle run aef_bng_pipeline -t dev
#
# Custom parameters:
#   databricks bundle run aef_bng_pipeline -t dev \
#     --params bounds="508848,163362,553002,196746",years="2024,2025"
#
# ============================================================================

bundle:
  name: aef-bng

# --- Variables (override per target) ----------------------------------------
variables:
  catalog:
    description: "Unity Catalog name"
    default: "<your-catalog>"
  schema:
    description: "Schema within the catalog"
    default: "<your-schema"
  table:
    description: "Delta table name for output"
    default: "<your-table>"

# --- Sync init scripts to workspace ----------------------------------------
sync:
  include:
    - "deps/init-scripts/aef-bng-job.sh"
    - "dist/wheel/*.whl"
    

# --- Resources --------------------------------------------------------------
resources:
  jobs:
    aef_bng_pipeline:
      name: "${bundle.target}-aef-bng-pipeline"

      # Job-level parameters (editable in the Workflows UI)
      parameters:
        - name: bounds
          default: "0,0,700000,1300000"  # Full GB extent
        - name: years
          default: "2025"
        - name: table_name
          default: "${var.catalog}.${var.schema}.${var.table}"
        - name: resampling
          default: "nearest"

      # Cluster definition
      job_clusters:
        - job_cluster_key: pipeline_cluster
          new_cluster:
            # --- Compute ---
            # Adjust node_type_id and autoscale to your budget/workload.
            # Standard_DS4_v2: 8 cores, 28GB RAM (Azure)
            # For AWS: use e.g. i3.2xlarge
            spark_version: "17.3.x-scala2.12"
            node_type_id: Standard_DS4_v2  # CHANGE for your cloud/size
            autoscale:
              min_workers: 1
              max_workers: 5

            # --- Spark configuration ---
            spark_conf:
              spark.task.cpus: "1"
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"
              spark.sql.execution.arrow.pyspark.enabled: "true"
              spark.sql.execution.arrow.maxRecordsPerBatch: "10000"
              spark.sql.shuffle.partitions: "auto"
              spark.databricks.io.cache.enabled: "true"

            # --- Init script (installs the aef-bng wheel) ---
            init_scripts:
              - workspace:
                  destination: ${workspace.file_path}/deps/init-scripts/aef-bng-job.sh

      # Task definition
      tasks:
        - task_key: process_embeddings
          job_cluster_key: pipeline_cluster
          python_wheel_task:
            package_name: aef_bng
            entry_point: aef-bng-spark
            parameters:
              - "--bounds={{job.parameters.bounds}}"
              - "--years={{job.parameters.years}}"
              - "--table-name={{job.parameters.table_name}}"
              - "--resampling={{job.parameters.resampling}}"
          libraries:
            - whl: ./dist/files/*.whl

          ## PyPI alternative (uncomment when aef-bng is published):
          # libraries:
          #   - pypi:
          #       package: "aef-bng[spark]"

# --- Targets ----------------------------------------------------------------
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: <your-databricks-workspace-url>  # e.g. https://adb-123456.3.azuredatabricks.net

  ## Production target with different catalog:
  # prod:
  #   workspace:
  #     host: <your-prod-workspace-url>
  #   variables:
  #     catalog: "<your-prod-catalog>"
