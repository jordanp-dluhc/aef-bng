site_name: aef-bng
site_description: Reproject Alpha Earth Foundation embeddings to British National Grid on Databricks.
site_url: https://communitiesuk.github.io/aef-bng
repo_url: https://github.com/communitiesuk/aef-bng
repo_name: communitiesuk/aef-bng

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Workflow: workflow.md
  - API Reference:
      - api/index.md
      - Config: api/config.md
      - Types: api/types.md
      - Grid: api/grid.md
      - Index: api/index_module.md
      - Reader: api/reader.md
      - Reproject: api/reproject.md
      - Extract: api/extract.md
      - Dequantise: api/dequantise.md
      - Spark: api/spark.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            members_order: source
            docstring_style: google
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
